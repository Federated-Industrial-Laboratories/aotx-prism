name: Checks

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/check_source.py
      - run: git show --format= --check HEAD
